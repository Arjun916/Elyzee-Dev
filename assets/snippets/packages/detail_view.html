<cms:set clonedpage_tttitle="<cms:call 'get_page_title' tname=k_template_name pname=k_page_name/>"/>

<cms:if (is_promotion eq 'Yes') && (pp_price gt pp_discount_price)>
<cms:set end_val ="<cms:date end_date format='Y-m-d'/> 23:59:59" />
<cms:set curr_val ="<cms:date format='Y-m-d H:i:s' />" />
<cms:if end_val ge curr_val>
	<cms:set has_promotion='1' 'global'/>
</cms:if>
</cms:if>


<cms:if k_page_foldertitle && k_page_foldertitle ne ''>
<cms:set curr_category_title_temp ="title_<cms:show k_lang/>" />
<cms:pages masterpage='multi_lang_folder.php' page_title=k_page_foldertitle limit='1'>
<cms:set curr_category_title = "<cms:get curr_category_title_temp/>" 'global'/>
<cms:if category_bgcolor && category_bgcolor ne ''>
<cms:set curr_category_bgcolor = "style='background-color:<cms:show category_bgcolor/> !important;'" 'global'/>
</cms:if>
</cms:pages>
</cms:if>

<!-- page-title -->
<section class="page-title pt-30 pb-30 text-center">
	<div class="container">
		<div class="row align-items-center">
			<div class="col-12">
				<cms:trim "<cms:embed 'common/breadcrumbs.html'/>"/>
			</div>
		</div>
	</div>
</section>

<!-- Details -->
<section class="blog blog-single pt-0 pb-80">
	<div class="container">
		<div class="row">
			<div class="col-sm-12 col-md-12 col-lg-8">
				<div class="post-item mb-0 h-auto">
					<div class="post__img">
						<img src="<cms:show img_output/>" alt="<cms:show clonedpage_tttitle/>" loading="lazy">
					</div>
					<div class="post__body pt-30 pb-0" id="package_details">
						<cms:if k_page_foldername>
						<div class="post__meta d-flex">
							<cms:if curr_category_title && curr_category_title ne ''>
								<span class="badge rounded bg-info text-light" <cms:show curr_category_bgcolor/>><cms:show curr_category_title/></span>
							</cms:if>
						</div>
						</cms:if>
						
						<div class="post__header m-0 d-block">
							<div class="h3 m-0"><cms:show clonedpage_tttitle/></div>
							<cms:set sub_title_temp = "sub_title_<cms:show k_lang/>"/>
							<cms:set sub_title_val = "<cms:get sub_title_temp/>"/>
							<cms:if sub_title_val><div class="d-block mt-1 font-weight-bold color-secondary"><cms:show sub_title_val/></div></cms:if>
							<div class="bg-secondary position-relative rounded mt-2 pb-3">
								<cms:if has_promotion && has_promotion eq '1'><span class="badge rounded bg-warning text-dark position-absolute top-0"><cms:get "promotion_title_<cms:show k_lang/>"/></span></cms:if>
		
								<div class="d-flex justify-content-between align-items-end pt-3">
									<div class="price_container link_area mx-3" data-href="<cms:show_with_lc k_page_link/>">
										<span class="text-light"><cms:get 'locale.price'/>:</span>
						
										<cms:if has_promotion && has_promotion eq '1'>
										<span class="original_price text-light"><s><cms:get 'locale.currency'/> <cms:show pp_price/></s></span><span class="sale_price mx-2 text-light feature__price"><strong><cms:get 'locale.currency'/> <cms:show pp_discount_price/></strong></span>
										<cms:else/>
										<span class="original_price text-light feature__price"><strong><cms:get 'locale.currency'/> <cms:show pp_price/></strong></span>
										</cms:if>
									</div>
		
									<cms:set curr_package_page="<cms:link 'book_package.php'/>"/>
									<a href='<cms:add_querystring curr_package_page "p=<cms:show k_page_name/>" />' class="btn btn__secondary rounded-pill mx-3"  title="<cms:get 'locale.book_appointment/>" aria-label="<cms:get 'locale.book_appointment/>'" <cms:show curr_category_bgcolor/>><i class="fa-solid fa-up-right-from-square"></i> <cms:get 'locale.book_now'/></a>
								</div>
	
								<cms:trim "<cms:embed 'common/flash_block.html'/>"/>
	
							</div>
						</div>	

						<div class="post__desc list-items p-0 border color-secondary" <cms:show curr_category_bgcolor/>>
							<div class="d-block p-3 bg-white-opacity75">
							<cms:do_shortcodes><cms:get "content_<cms:show k_lang />" /></cms:do_shortcodes>
							
							
							<div class="services_container">
								
								<cms:related_pages 'complimentary_services' orderby='weight' order='desc'>
								<cms:if k_count eq '1'><div class="h6 m-0"><i class="fa-solid fa-gift text-dark p-2 bg-warning rounded-pill mx-1"></i> <cms:get 'locale.with_free_complimentary_services'/></div><ul class="small"></cms:if>
								<li><strong><cms:show k_page_title/></strong> <div class="badge badge-warning"><s class="text-muted"><cms:get 'locale.currency'/> <cms:show pp_price/></s> <strong><cms:get 'locale.free'/></strong></div><cms:get curr_ser_desc/></li>
								<cms:if k_count eq k_total_records></ul></cms:if>
								</cms:related_pages>
								
								<div class="h6 mb-2"><cms:get 'locale.services_included_in_package'/></div>
								<cms:set curr_ser_desc="content_<cms:show k_lang/>"/>
								<ul class="small"><cms:related_pages 'linked_services' orderby='weight' order='desc'><li><strong><cms:show k_page_title/></strong><cms:get curr_ser_desc/></li></cms:related_pages></ul>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<cms:trim "<cms:embed 'packages/sidebar.html'/>"/>
		</div><!-- /.row -->
	</div><!-- /.container -->
</section>
<cms:trim "<cms:embed 'common/prevnext.html' />"/>
